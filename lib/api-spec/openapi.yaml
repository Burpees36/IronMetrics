components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
        isAuthenticated:
          type: boolean
      required:
        - id
        - isAuthenticated

    Gym:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        zip:
          type: ["string", "null"]
        timezone:
          type: string
        logoUrl:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        memberCount:
          type: integer
        activeCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - timezone
        - memberCount
        - activeCount
        - createdAt

    CreateGymBody:
      type: object
      properties:
        name:
          type: string
        timezone:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        zip:
          type: ["string", "null"]
      required:
        - name
        - timezone

    UpdateGymBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        zip:
          type: ["string", "null"]
        timezone:
          type: string
        logoUrl:
          type: ["string", "null"]
        website:
          type: ["string", "null"]

    Member:
      type: object
      properties:
        id:
          type: integer
        gymId:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive, hold, cancelled, prospect]
        membershipType:
          type: ["string", "null"]
        joinDate:
          type: ["string", "null"]
          format: date
        birthDate:
          type: ["string", "null"]
          format: date
        profileImageUrl:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        riskScore:
          type: ["number", "null"]
        riskTier:
          type: ["string", "null"]
        lastVisitDate:
          type: ["string", "null"]
          format: date-time
        attendanceCount30d:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - gymId
        - firstName
        - lastName
        - email
        - status
        - tags
        - createdAt

    MemberDetail:
      allOf:
        - $ref: "#/components/schemas/Member"
