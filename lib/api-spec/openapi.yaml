openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Iron Metrics Gym Management Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: gyms
    description: Gym and organization management
  - name: members
    description: Member management
  - name: leads
    description: Lead and CRM management
  - name: staff
    description: Staff management
  - name: classes
    description: Class scheduling
  - name: attendance
    description: Attendance tracking
  - name: billing
    description: Billing and subscriptions
  - name: retail
    description: Retail and POS
  - name: workouts
    description: Workout tracking
  - name: communications
    description: Member communications
  - name: documents
    description: Documents and waivers
  - name: intelligence
    description: Iron Metrics intelligence engine
  - name: ai-operator
    description: AI operator tools
  - name: reporting
    description: Reports and dashboards

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/user:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated

  # GYMS
  /gyms:
    get:
      operationId: listGyms
      tags: [gyms]
      summary: List all gyms accessible to current user
      responses:
        "200":
          description: List of gyms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Gym"
    post:
      operationId: createGym
      tags: [gyms]
      summary: Create a new gym
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGymBody"
      responses:
        "201":
          description: Created gym
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gym"

  /gyms/{gymId}:
    get:
      operationId: getGym
      tags: [gyms]
      summary: Get gym details
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Gym details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gym"
        "404":
          description: Not found
    patch:
      operationId: updateGym
      tags: [gyms]
      summary: Update gym details
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGymBody"
      responses:
        "200":
          description: Updated gym
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gym"

  # MEMBERS
  /gyms/{gymId}/members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List gym members
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListResponse"
    post:
      operationId: createMember
      tags: [members]
      summary: Create a new member
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemberBody"
      responses:
        "201":
          description: Created member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /gyms/{gymId}/members/{memberId}:
    get:
      operationId: getMember
      tags: [members]
      summary: Get member details
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Member details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDetail"
        "404":
          description: Not found
    patch:
      operationId: updateMember
      tags: [members]
      summary: Update member details
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberBody"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /gyms/{gymId}/members/{memberId}/notes:
    post:
      operationId: addMemberNote
      tags: [members]
      summary: Add note to member record
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemberNoteBody"
      responses:
        "201":
          description: Note added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberNote"

  /gyms/{gymId}/members/{memberId}/timeline:
    get:
      operationId: getMemberTimeline
      tags: [members]
      summary: Get member activity timeline
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Member timeline events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineEvent"

  # LEADS / CRM
  /gyms/{gymId}/leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List leads
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: stage
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      tags: [leads]
      summary: Create a new lead
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadBody"
      responses:
        "201":
          description: Created lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /gyms/{gymId}/leads/{leadId}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get lead details
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: leadId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update lead
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: leadId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeadBody"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /gyms/{gymId}/leads/{leadId}/convert:
    post:
      operationId: convertLeadToMember
      tags: [leads]
      summary: Convert lead to paying member
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: leadId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  # STAFF
  /gyms/{gymId}/staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List gym staff
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of staff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
    post:
      operationId: inviteStaff
      tags: [staff]
      summary: Invite a staff member
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteStaffBody"
      responses:
        "201":
          description: Staff invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /gyms/{gymId}/staff/{staffId}:
    patch:
      operationId: updateStaff
      tags: [staff]
      summary: Update staff member
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: staffId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaffBody"
      responses:
        "200":
          description: Updated staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
    delete:
      operationId: removeStaff
      tags: [staff]
      summary: Remove staff access
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: staffId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Staff removed

  # CLASSES
  /gyms/{gymId}/classes:
    get:
      operationId: listClasses
      tags: [classes]
      summary: List scheduled classes
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GymClass"
    post:
      operationId: createClass
      tags: [classes]
      summary: Create a class
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassBody"
      responses:
        "201":
          description: Created class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymClass"

  /gyms/{gymId}/classes/{classId}:
    get:
      operationId: getClass
      tags: [classes]
      summary: Get class details with roster
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: classId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Class with roster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymClassDetail"
    patch:
      operationId: updateClass
      tags: [classes]
      summary: Update class
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: classId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClassBody"
      responses:
        "200":
          description: Updated class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymClass"
    delete:
      operationId: deleteClass
      tags: [classes]
      summary: Delete class
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: classId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /gyms/{gymId}/classes/{classId}/checkin:
    post:
      operationId: checkInToClass
      tags: [attendance]
      summary: Check in member to class
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: classId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInBody"
      responses:
        "201":
          description: Checked in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"

  # ATTENDANCE
  /gyms/{gymId}/attendance:
    get:
      operationId: listAttendance
      tags: [attendance]
      summary: List attendance records
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: query
          schema:
            type: integer
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attendance"

  # BILLING
  /gyms/{gymId}/plans:
    get:
      operationId: listMembershipPlans
      tags: [billing]
      summary: List membership plans
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MembershipPlan"
    post:
      operationId: createMembershipPlan
      tags: [billing]
      summary: Create membership plan
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMembershipPlanBody"
      responses:
        "201":
          description: Created plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipPlan"

  /gyms/{gymId}/subscriptions:
    get:
      operationId: listSubscriptions
      tags: [billing]
      summary: List member subscriptions
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
    post:
      operationId: createSubscription
      tags: [billing]
      summary: Create subscription for member
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionBody"
      responses:
        "201":
          description: Created subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /gyms/{gymId}/subscriptions/{subscriptionId}:
    patch:
      operationId: updateSubscription
      tags: [billing]
      summary: Update subscription (hold, cancel, resume)
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubscriptionBody"
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /gyms/{gymId}/invoices:
    get:
      operationId: listInvoices
      tags: [billing]
      summary: List invoices
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invoice"

  /gyms/{gymId}/stripe/publishable-key:
    get:
      operationId: getStripePublishableKey
      tags: [billing]
      summary: Get Stripe publishable key
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Publishable key
          content:
            application/json:
              schema:
                type: object
                properties:
                  publishableKey:
                    type: string

  /gyms/{gymId}/members/{memberId}/setup-intent:
    post:
      operationId: createSetupIntent
      tags: [billing]
      summary: Create Stripe setup intent for payment method
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Setup intent
          content:
            application/json:
              schema:
                type: object
                properties:
                  clientSecret:
                    type: string
                  customerId:
                    type: string

  /gyms/{gymId}/members/{memberId}/payment-methods:
    get:
      operationId: listPaymentMethods
      tags: [billing]
      summary: List payment methods for member
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment methods
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    brand:
                      type: string
                    last4:
                      type: string
                    expMonth:
                      type: integer
                    expYear:
                      type: integer

  /gyms/{gymId}/members/{memberId}/stripe-subscription:
    post:
      operationId: createStripeSubscription
      tags: [billing]
      summary: Create Stripe-backed subscription
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - planId
              properties:
                planId:
                  type: integer
                paymentMethodId:
                  type: string
      responses:
        "201":
          description: Created subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /gyms/{gymId}/members/{memberId}/billing-history:
    get:
      operationId: getMemberBillingHistory
      tags: [billing]
      summary: Get billing history for member
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Billing history
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Subscription"
                  payments:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentRecord"
                  invoices:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invoice"

  /gyms/{gymId}/members/{memberId}/charge:
    post:
      operationId: createOneTimeCharge
      tags: [billing]
      summary: Create one-time charge for member
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - description
              properties:
                amount:
                  type: number
                description:
                  type: string
                paymentMethodId:
                  type: string
      responses:
        "201":
          description: Charge result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRecord"

  /gyms/{gymId}/subscriptions/{subscriptionId}/cancel:
    post:
      operationId: cancelSubscription
      tags: [billing]
      summary: Cancel subscription
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cancelAtPeriodEnd:
                  type: boolean
                  default: true
                reason:
                  type: string
      responses:
        "200":
          description: Cancelled subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /gyms/{gymId}/subscriptions/{subscriptionId}/pause:
    post:
      operationId: pauseSubscription
      tags: [billing]
      summary: Pause subscription
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Paused subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /gyms/{gymId}/subscriptions/{subscriptionId}/resume:
    post:
      operationId: resumeSubscription
      tags: [billing]
      summary: Resume paused subscription
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resumed subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /gyms/{gymId}/payments:
    get:
      operationId: listPayments
      tags: [billing]
      summary: List payments
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentRecord"

