openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Iron Metrics Gym Management Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: gyms
    description: Gym and organization management
  - name: members
    description: Member management
  - name: leads
    description: Lead and CRM management
  - name: staff
    description: Staff management
  - name: classes
    description: Class scheduling
  - name: attendance
    description: Attendance tracking
  - name: billing
    description: Billing and subscriptions
  - name: retail
    description: Retail and POS
  - name: workouts
    description: Workout tracking
  - name: programming
    description: Daily programming management
  - name: communications
    description: Member communications
  - name: documents
    description: Documents and waivers
  - name: intelligence
    description: Iron Metrics intelligence engine
  - name: ai-operator
    description: AI operator tools
  - name: reporting
    description: Reports and dashboards
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/user:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated

  # GYMS
  /gyms:
    get:
      operationId: listGyms
      tags: [gyms]
      summary: List all gyms accessible to current user
      responses:
        "200":
          description: List of gyms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Gym"
    post:
      operationId: createGym
      tags: [gyms]
      summary: Create a new gym
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGymBody"
      responses:
        "201":
          description: Created gym
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gym"

  /gyms/{gymId}:
    get:
      operationId: getGym
      tags: [gyms]
      summary: Get gym details
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Gym details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gym"
        "404":
          description: Not found
    patch:
      operationId: updateGym
      tags: [gyms]
      summary: Update gym details
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGymBody"
      responses:
        "200":
          description: Updated gym
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Gym"

  # MEMBERS
  /gyms/{gymId}/members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List gym members
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListResponse"
    post:
      operationId: createMember
      tags: [members]
      summary: Create a new member
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemberBody"
      responses:
        "201":
          description: Created member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /gyms/{gymId}/members/{memberId}:
    get:
      operationId: getMember
      tags: [members]
      summary: Get member details
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Member details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDetail"
        "404":
          description: Not found
    patch:
      operationId: updateMember
      tags: [members]
      summary: Update member details
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberBody"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /gyms/{gymId}/members/check-email:
    get:
      operationId: checkMemberEmail
      tags: [members]
      summary: Check if email is already in use by an existing member
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: email
          in: query
          required: true
          schema:
            type: string
        - name: excludeMemberId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Email check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailCheckResult"

  /gyms/{gymId}/members/membership-types:
    get:
      operationId: listMembershipTypes
      tags: [members]
      summary: Get distinct membership types used in this gym
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of membership type strings
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /gyms/{gymId}/members/{memberId}/notes:
    post:
      operationId: addMemberNote
      tags: [members]
      summary: Add note to member record
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemberNoteBody"
      responses:
        "201":
          description: Note added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberNote"

  /gyms/{gymId}/members/{memberId}/timeline:
    get:
      operationId: getMemberTimeline
      tags: [members]
      summary: Get member activity timeline
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Member timeline events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimelineEvent"

  # LEADS / CRM
  /gyms/{gymId}/leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List leads
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: stage
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      tags: [leads]
      summary: Create a new lead
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadBody"
      responses:
        "201":
          description: Created lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /gyms/{gymId}/leads/{leadId}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get lead details
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: leadId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update lead
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: leadId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeadBody"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /gyms/{gymId}/leads/{leadId}/convert:
    post:
      operationId: convertLeadToMember
      tags: [leads]
      summary: Convert lead to paying member
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: leadId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                startDate:
                  type: string
                  format: date
                note:
                  type: string
      responses:
        "200":
          description: Conversion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /gyms/{gymId}/leads/insights:
    get:
      operationId: getLeadInsights
      tags: [leads]
      summary: Get sales funnel insights
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadInsights"

  /gyms/{gymId}/leads/{leadId}/activities:
    get:
      operationId: listLeadActivities
      tags: [leads]
      summary: List lead activity history
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: leadId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeadActivity"
    post:
      operationId: createLeadActivity
      tags: [leads]
      summary: Log a lead activity
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: leadId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                description:
                  type: string
              required:
                - type
                - description
      responses:
        "200":
          description: Updated activities list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeadActivity"

  # STAFF
  /gyms/{gymId}/staff:
    get:
      operationId: listStaff
      tags: [staff]
      summary: List gym staff
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of staff
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffMember"
    post:
      operationId: inviteStaff
      tags: [staff]
      summary: Invite a staff member
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteStaffBody"
      responses:
        "201":
          description: Staff invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"

  /gyms/{gymId}/staff/{staffId}:
    patch:
      operationId: updateStaff
      tags: [staff]
      summary: Update staff member
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: staffId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaffBody"
      responses:
        "200":
          description: Updated staff
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMember"
    delete:
      operationId: removeStaff
      tags: [staff]
      summary: Remove staff access
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: staffId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Staff removed

  # CLASSES
  /gyms/{gymId}/classes:
    get:
      operationId: listClasses
      tags: [classes]
      summary: List scheduled classes
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GymClass"
    post:
      operationId: createClass
      tags: [classes]
      summary: Create a class
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassBody"
      responses:
        "201":
          description: Created class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymClass"

  /gyms/{gymId}/classes/{classId}:
    get:
      operationId: getClass
      tags: [classes]
      summary: Get class details with roster
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: classId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Class with roster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymClassDetail"
    patch:
      operationId: updateClass
      tags: [classes]
      summary: Update class
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: classId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClassBody"
      responses:
        "200":
          description: Updated class
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GymClass"
    delete:
      operationId: deleteClass
      tags: [classes]
      summary: Delete class
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: classId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /gyms/{gymId}/classes/{classId}/checkin:
    post:
      operationId: checkInToClass
      tags: [attendance]
      summary: Check in member to class
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: classId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckInBody"
      responses:
        "201":
          description: Checked in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"

  # CLASS SCHEDULING SHORTCUTS
  /gyms/{gymId}/classes/copy-week/preview:
    post:
      operationId: previewCopyWeek
      tags: [classes]
      summary: Preview copying last week's classes
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyWeekBody"
      responses:
        "200":
          description: Preview of classes to create and skip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyWeekPreview"

  /gyms/{gymId}/classes/copy-week:
    post:
      operationId: copyWeek
      tags: [classes]
      summary: Copy classes from one week to another
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyWeekBody"
      responses:
        "200":
          description: Result of copy operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyWeekResult"

  /gyms/{gymId}/class-templates:
    get:
      operationId: listClassTemplates
      tags: [classes]
      summary: List class schedule templates
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ClassTemplate"
    post:
      operationId: createClassTemplate
      tags: [classes]
      summary: Save current week as a template
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassTemplateBody"
      responses:
        "201":
          description: Created template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassTemplateDetail"

  /gyms/{gymId}/class-templates/{templateId}:
    get:
      operationId: getClassTemplate
      tags: [classes]
      summary: Get template details with items
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Template with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassTemplateDetail"
        "404":
          description: Not found
    patch:
      operationId: updateClassTemplate
      tags: [classes]
      summary: Rename or update template
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClassTemplateBody"
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassTemplate"
    delete:
      operationId: deleteClassTemplate
      tags: [classes]
      summary: Delete a template
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /gyms/{gymId}/class-templates/{templateId}/apply/preview:
    post:
      operationId: previewApplyTemplate
      tags: [classes]
      summary: Preview applying a template to a target week
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyTemplateBody"
      responses:
        "200":
          description: Preview of classes to create and skip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyWeekPreview"

  /gyms/{gymId}/class-templates/{templateId}/apply:
    post:
      operationId: applyClassTemplate
      tags: [classes]
      summary: Apply a template to a target week
      parameters:
        - name: gymId
          in: path
          required: true
          schema:
            type: integer
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyTemplateBody"
      responses:
        "200":
          description: Result of apply operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyWeekResult"

  # ATTENDANCE
  /gyms/{gymId}/attendance:
    get:
      operationId: listAttendance
      tags: [attendance]
      summary: List attendance records
      parameters:
        - name: gymId
          in: path
