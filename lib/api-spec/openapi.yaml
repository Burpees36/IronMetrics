          properties:
            emergencyContactName:
              type: ["string", "null"]
            emergencyContactPhone:
              type: ["string", "null"]
            address:
              type: ["string", "null"]
            city:
              type: ["string", "null"]
            state:
              type: ["string", "null"]
            notes:
              type: array
              items:
                $ref: "#/components/schemas/MemberNote"
