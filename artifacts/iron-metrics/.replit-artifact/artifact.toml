kind = "web"
previewPath = "/"
title = "Iron Metrics"
version = "1.0.0"
id = "artifacts/iron-metrics"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 23736
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/iron-metrics run dev"

[services.env]
PORT = "23736"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/iron-metrics", "run", "build"]
publicDir = "artifacts/iron-metrics/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
